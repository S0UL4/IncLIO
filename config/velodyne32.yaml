# config/velodyne_ros2.yaml
# IncLIO config for Velodyne VLP-16 used via ROS2 live topics.
# Copy / adjust extrinsics for your sensor mount.

# preprocess: nothing to set — the sensor setup is detected from the streams.
#   lidar_type  <- message type advertised on the LiDAR topic, then the
#                  PointCloud2 field table (x/y/z/intensity/ring/time offsets)
#   scan_line   <- ring channel (or the cloud height for organized clouds)
#   time_scale  <- unit of the per-point time field, from the observed span of
#                  one scan (a revolution lasts 10-500 ms and the candidate
#                  units s/ms/us/ns are 1000x apart, so the match is unique)
#   imu_coeff   <- magnitude of the first accelerometer samples (|a| ~ 1 => the
#                  stream is in g, |a| ~ 9.81 => it is already in m/s^2)
# Add a `preprocess:` block only to override one of them, e.g.
#   preprocess:
#     lidar_type: ouster   # auto | livox | velodyne | ouster | hesai
#     scan_line:  64
#     time_scale: 1e-6     # raw per-point time unit -> milliseconds
#     imu_coeff:  9.80665
#     blind:      4.0      # drop returns closer than this to the sensor [m]

mapping:
  extrinsic_T: [0.112, -0.176, 0.247]
  extrinsic_R: [ -0.012, -1.000,  0.014,
                1.000, -0.012, -0.003 ,
                0.003,  0.014,  1.000 ]

point_filter_num: 1
max_iteration: 3
max_static_acce_var: 0.2
max_static_gyro_var: 0.5
imu_init_time: 5.0



# Set use_static_init: false to skip static initialization and use prior biases.
# Useful when start system while already moving ( for better results , use the static initialization).
# prior_gravity must be set in body frame when use_static_init is false;
# [0, 0, -9.81] assumes a level-mounted IMU with z-down convention.
use_static_init: true
prior_bg: [-0.000252,  0.000481, -0.002086]
prior_ba: [ 0.000127, -0.000228, -0.012919]
prior_gravity: [0.0, 0.0, -9.81]

# DLIO continuous-time motion correction (set false to use original slerp/lerp)
use_ct_undistort: true

# Wheel-odometry fusion (IESKF ObserveWheelSpeed). Tunables only — to ENABLE,
# set the launch arg wheel_odom_topic:=<nav_msgs/Odometry topic> (empty = off).
# r_imu_wheel is the IMU->axle offset in the IMU body frame [m] — MEASURE IT on
# the robot; a wrong value injects a yaw-rate-dependent lateral bias.
wheel_odom:
  r_imu_wheel:   [0.110, -0.180, -0.710]   # IMU -> wheel/axle origin, body frame [m]
  vel_noise:     0.10                     # forward-speed std-dev [m/s]
  nhc_noise:     0.01                     # lateral/vertical NHC std-dev [m/s] (keep tight)
  yaw_noise:     0.10                     # yaw-rate std-dev [rad/s]
  use_lever_arm: true                     # include lever-arm coupling into gyro bias
  use_yaw_rate:  true                     # include the yaw-rate (gyro-z-bias) row
  chi2_thresh:   13.28                    # slip gate: reject obs with chi2 > this (4-DOF 99%); <= 0 disables


frames:
  world_frame:       "odom"           # parent of the published SLAM TF
  base_frame:        "base_link"      # child of the published SLAM TF
  imu_frame:         "imu_link"   # used for TF lookup (lidar->imu, base->imu)
  lidar_frame:       "velodyne"     # used for TF lookup of the lidar->imu extrinsic
  use_tf_extrinsic:  true             # true: read lidar->imu extrinsic from TF instead of extrinsic_T/R
  tf_lookup_timeout: 5.0              # seconds to wait for the static TFs on startup
  publish_tf: false